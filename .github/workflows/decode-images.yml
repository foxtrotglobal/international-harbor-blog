name: Decode site images

on:
  push:
    branches: [main]
    paths:
      - '**/*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            base64 -d "$f" > /tmp/decoded.bin
            test -s /tmp/decoded.bin
            if [ -f "$out" ] && cmp -s /tmp/decoded.bin "$out"; then
              echo "Up to date: $out"
              continue
            fi
            mkdir -p "$(dirname "$out")"
            mv /tmp/decoded.bin "$out"
            git add "$out"
            found=1
            echo "Decoded $out"
          done < <(find . -name '*.b64' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No image changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add decoded site images"
          git push
